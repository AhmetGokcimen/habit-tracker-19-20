<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore · Habit Tracker</title>
    <script src="/js/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/pages/explore.js"></script>
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main id="main" class="page">
      <header class="page-head">
        <div>
          <p class="eyebrow">Shared habits</p>
          <h1>Explore</h1>
          <p class="lede">Habits other people chose to share. Find one that fits you, or leave a note of support.</p>
        </div>
      </header>

      
      <form id="search-form" class="search-bar" role="search" novalidate>

        <!-- Search habits -->
        <div class="search-input-group">
          <label class="visually-hidden" for="q">Search shared habits</label>
          <input class="input" id="q" name="q" type="search"
                minlength="2" maxlength="50" placeholder="Search titles and descriptions"
                autocomplete="off" />
          <button class="btn btn-primary" type="submit">Search</button>
        </div>

        <!-- Sort By -->
        <div class="search-filter">
          <label class="visually-hidden" for="sort">Sort habits</label>
          <select class="input" id="sort" name="sort">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="popular">Most Popular</option>
            <option value="discussed">Most Discussed</option>
          </select>
        </div>

        <!-- Frequency -->
        <div class="search-filter">
          <label class="visually-hidden" for="frequency">Filter by frequency</label>
          <select class="input" id="frequency" name="frequency">
            <option value="">All Schedules</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Specific Days</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>

        <!-- Goal Type -->
        <div class="search-filter">
          <label class="visually-hidden" for="goal-type">Filter by goal type</label>
          <select class="input" id="goal-type" name="goal_type">
            <option value="">All Goals</option>
            <option value="simple">Simple Check-in</option>
            <option value="measurable">Measurable Goal</option>
          </select>
        </div>

        <!-- Reset Filters -->
        <button class="btn btn-ghost" id="reset-filters" type="button">
          Reset Filters
        </button>

      </form>
      <!-- Display currently active search filters -->
      <div id="active-filters" class="active-filters" aria-live="polite" hidden></div>
      
      <div id="categories" class="chips" role="group" aria-label="Filter by category"></div>

      <section id="feed" class="section"></section>

      <section class="section" aria-labelledby="results-heading">
        <div class="section-head">
          <h2 id="results-heading">Results</h2>
          <span id="result-count" class="mono muted"></span>
        </div>
        <div id="results" aria-live="polite"></div>
        <nav id="pager" class="pager" aria-label="Pages"></nav>
      </section>
    </main>
  </body>
</html>
